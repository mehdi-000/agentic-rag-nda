services:
  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  app:
    build:
      context: ./nda_rag
    volumes:
      - ./nda_rag/docs:/app/docs
      - ./nda_rag/index/parents:/app/index/parents
    ports:
      - "7860:7860"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      LLM_MODEL: qwen2.5:7b-instruct
      FAST_MODEL: qwen2.5:3b
      EMBED_MODEL: nomic-embed-text
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
