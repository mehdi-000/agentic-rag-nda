services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  app:
    build:
      context: ./nda_rag
    volumes:
      - ./nda_rag/docs:/app/docs
      - ./nda_rag/index:/app/index
    ports:
      - "7860:7860"
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      LLM_MODEL: qwen2.5:3b
      FAST_MODEL: qwen2.5:3b
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
